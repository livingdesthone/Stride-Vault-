<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stride Vault — Order Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08090a;
  color:#f5f5f2;
  font-family:Arial,sans-serif
}

.wrap{
  width:min(1200px,94%);
  margin:24px auto
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  flex-wrap:wrap
}

h1{font-size:28px;margin-bottom:5px}
.muted{color:#999}

.card{
  background:#111314;
  border:1px solid #292b2d;
  border-radius:16px;
  padding:16px;
  margin:14px 0
}

input,button,select{
  border:1px solid #333;
  background:#17191a;
  color:#fff;
  border-radius:10px;
  padding:12px
}

button{cursor:pointer}

.primary{
  background:#d7ff45;
  color:#08090a;
  border:0;
  font-weight:800
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}

.stat b{font-size:24px}

.tools{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:10px
}

.tools input,
.tools select{
  width:100%
}

table{
  width:100%;
  border-collapse:collapse
}

.scroll{overflow:auto}

th,td{
  padding:12px 8px;
  border-bottom:1px solid #292b2d;
  text-align:left;
  vertical-align:top
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:999px;
  background:#222;
  font-size:12px
}

.whatsapp{
  display:inline-block;
  margin-top:8px;
  padding:8px 10px;
  border-radius:8px;
  background:#25D366;
  color:#061b0d;
  text-decoration:none;
  font-weight:800;
  font-size:12px
}

.login{
  max-width:420px;
  margin:15vh auto
}

.empty{
  text-align:center;
  padding:30px;
  color:#999
}

@media(max-width:850px){
  .tools{
    grid-template-columns:1fr 1fr
  }

  .grid{
    grid-template-columns:repeat(2,1fr)
  }
}

@media(max-width:600px){
  .wrap{
    width:94%;
    margin:15px auto
  }

  h1{
    font-size:25px
  }

  .tools{
    grid-template-columns:1fr
  }

  th,td{
    padding:10px 6px;
    font-size:13px
  }

  th:nth-child(3),
  td:nth-child(3){
    min-width:105px
  }

  .grid{
    grid-template-columns:repeat(2,1fr)
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login card">

  <h1>Stride Vault</h1>

  <p class="muted">
    Private Order Dashboard
  </p>

  <input
    id="password"
    type="password"
    placeholder="Admin password"
    style="width:100%"
  >

  <button
    class="primary"
    style="width:100%;margin-top:10px"
    onclick="login()"
  >
    Open Dashboard
  </button>

  <p id="loginMsg" class="muted"></p>

</div>


<!-- DASHBOARD -->
<div id="app" class="wrap" style="display:none">

  <div class="top">

    <div>
      <h1>Order Dashboard</h1>
      <p class="muted">Stride Vault</p>
    </div>

    <button onclick="loadOrders()">
      Refresh
    </button>

  </div>


  <!-- STATS -->
  <div class="grid">

    <div class="card stat">
      <span class="muted">Orders</span>
      <br>
      <b id="count">0</b>
    </div>

    <div class="card stat">
      <span class="muted">Paid</span>
      <br>
      <b id="paid">0</b>
    </div>

    <div class="card stat">
      <span class="muted">Delivered</span>
      <br>
      <b id="delivered">0</b>
    </div>

    <div class="card stat">
      <span class="muted">Sales</span>
      <br>
      <b id="sales">GH₵0.00</b>
    </div>

  </div>


  <!-- SEARCH / FILTERS -->
  <div class="card">

    <div class="tools">

      <input
        id="search"
        type="search"
        placeholder="Search customer, phone or order..."
        oninput="applyFilters()"
      >

      <select id="statusFilter" onchange="applyFilters()">

        <option value="">All statuses</option>
        <option value="Paid">Paid</option>
        <option value="Processing">Processing</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>

      </select>

      <input
        id="dateFilter"
        type="date"
        onchange="applyFilters()"
      >

      <button onclick="clearFilters()">
        Clear
      </button>

    </div>

  </div>


  <!-- ORDERS -->
  <div class="card">

    <div class="scroll">

      <table>

        <thead>

          <tr>
            <th>Customer</th>
            <th>Order</th>
            <th>Total</th>
            <th>Delivery</th>
            <th>Status</th>
          </tr>

        </thead>

        <tbody id="orders">

          <tr>
            <td colspan="5" class="empty">
              Loading…
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

let allOrders = [];


/* =========================
   LOGIN
========================= */

async function login(){

  const password =
    document.getElementById("password").value;

  if(!password){

    document.getElementById("loginMsg").textContent =
      "Enter your admin password.";

    return;
  }

  try{

    const r = await fetch(
      "/api/admin-login",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({password})
      }
    );

    let data={};

    try{
      data=await r.json();
    }catch(e){}

    if(!r.ok){

      document.getElementById("loginMsg").textContent =
        data.error || ("Login failed ("+r.status+").");

      return;
    }

    document.getElementById("login").style.display="none";

    document.getElementById("app").style.display="block";

    loadOrders();

  }catch(e){

    document.getElementById("loginMsg").textContent =
      "Connection failed. Please try again.";

  }

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  try{

    const r =
      await fetch("/api/orders");

    if(r.status===401){

      document.getElementById("login").style.display="block";

      document.getElementById("app").style.display="none";

      return;
    }

    const data =
      await r.json().catch(
        ()=>({error:"Server returned invalid JSON."})
      );

    if(!r.ok){

      alert(
        data.error ||
        ("Could not load orders ("+r.status+").")
      );

      return;
    }

    if(!data || !Array.isArray(data.orders)){

      alert(
        data?.error ||
        "Could not load orders."
      );

      return;
    }

    allOrders = data.orders;

    updateStats(allOrders);

    applyFilters();

  }catch(e){

    alert(
      "Dashboard connection failed. Check your Vercel deployment."
    );

  }

}


/* =========================
   STATISTICS
========================= */

function updateStats(data){

  document.getElementById("count").textContent =
    data.length;

  document.getElementById("paid").textContent =
    data.filter(
      x=>x.status==="Paid"
    ).length;

  document.getElementById("delivered").textContent =
    data.filter(
      x=>x.status==="Delivered"
    ).length;

  const sales =
    data.reduce(
      (sum,x)=>
        sum + Number(x.total_amount || 0),
      0
    );

  document.getElementById("sales").textContent =
    "GH₵"+sales.toFixed(2);

}


/* =========================
   SEARCH + FILTER
========================= */

function applyFilters(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const status =
    document
      .getElementById("statusFilter")
      .value;

  const date =
    document
      .getElementById("dateFilter")
      .value;


  const filtered =
    allOrders.filter(o=>{

      const searchable = [

        o.customer_name,
        o.customer_phone,
        o.reference

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


      const matchesSearch =
        !search ||
        searchable.includes(search);


      const matchesStatus =
        !status ||
        o.status === status;


      let matchesDate = true;

      if(date && o.created_at){

        matchesDate =
          new Date(o.created_at)
            .toISOString()
            .slice(0,10) === date;

      }


      return (
        matchesSearch &&
        matchesStatus &&
        matchesDate
      );

    });


  render(filtered);

}


/* =========================
   CLEAR FILTERS
========================= */

function clearFilters(){

  document.getElementById("search").value="";
  document.getElementById("statusFilter").value="";
  document.getElementById("dateFilter").value="";

  render(allOrders);

}


/* =========================
   RENDER ORDERS
========================= */

function render(data){

  const body =
    document.getElementById("orders");


  if(!data.length){

    body.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          No matching orders found.
        </td>
      </tr>
    `;

    return;
  }


  body.innerHTML =
    data.map(o=>{

      const items =
        Array.isArray(o.items)
          ? o.items
              .map(x =>
                `${esc(x.name)} — ${esc(x.size)} × ${esc(x.qty)}`
              )
              .join("<br>")
          : esc(o.items || "");


      const statuses =
        [
          "Paid",
          "Processing",
          "Delivered",
          "Cancelled"
        ]
        .map(v=>`
          <option
            value="${v}"
            ${v===o.status?"selected":""}
          >
            ${v}
          </option>
        `)
        .join("");


      const phone =
        whatsappNumber(o.customer_phone);


      const whatsapp =
        phone
          ? `
            <a
              class="whatsapp"
              href="https://wa.me/${phone}"
              target="_blank"
              rel="noopener"
            >
              WhatsApp
            </a>
          `
          : "";


      return `
        <tr>

          <td>
            <b>
              ${esc(o.customer_name)}
            </b>

            <br>

            ${esc(o.customer_phone)}

            ${whatsapp}

          </td>


          <td>

            <small>
              ${esc(o.reference)}
            </small>

            <br><br>

            ${items}

          </td>


          <td>

            <b>
              GH₵${Number(
                o.total_amount || 0
              ).toFixed(2)}
            </b>

          </td>


          <td>

            ${esc(
              o.delivery_location
            )}

            <br>

            <span class="muted">
              ${esc(o.landmark || "")}
            </span>

          </td>


          <td>

            <select
              onchange="updateStatus('${esc(o.id)}',this.value)"
            >

              ${statuses}

            </select>

          </td>

        </tr>
      `;

    })
    .join("");

}


/* =========================
   UPDATE STATUS
========================= */

async function updateStatus(id,status){

  try{

    const r =
      await fetch(
        "/api/orders",
        {
          method:"PATCH",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            id,
            status
          })
        }
      );


    if(!r.ok){

      const data =
        await r.json().catch(
          ()=>({})
        );

      alert(
        data.error ||
        "Could not update status."
      );

      loadOrders();

      return;
    }


    // Refresh the dashboard after update
    await loadOrders();


  }catch(e){

    alert(
      "Could not update order status."
    );

    loadOrders();

  }

}


/* =========================
   WHATSAPP PHONE
========================= */

function whatsappNumber(phone){

  if(!phone) return "";

  let number =
    String(phone)
      .replace(/\D/g,"");


  // Ghana numbers beginning with 0
  if(number.startsWith("0")){

    number =
      "233" + number.slice(1);

  }


  return number;

}


/* =========================
   ESCAPE HTML
========================= */

function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m])
    );

}

</script>

</body>
  </html>
